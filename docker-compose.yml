services:
  db:
    image: postgres:16
    container_name: ottodot-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ottodot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ottodot}
      POSTGRES_DB: ${POSTGRES_DB:-ottodot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ottodot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ottodot} -d ${POSTGRES_DB:-ottodot}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ottodot_pgdata:
